[project]
name = "eucc"
version = "0.0.1"
description = "Bilingual RAG + agent copilot for GDPR, AI Act and DORA on Databricks."
readme = "README.md"
authors = [
    { name = "rtutul07", email = "rezaul.tutul@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"  # oldest runtime: requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
