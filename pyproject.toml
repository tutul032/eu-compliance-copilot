[project]
name = "eucc"
version = "0.0.1"
description = "Bilingual RAG + agent copilot for GDPR, AI Act and DORA on Databricks."
readme = "README.md"
authors = [
    { name = "rtutul07", email = "rezaul.tutul@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "databricks-sdk>=0.161.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
build_corpus_job = "eucc.jobs.build_corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eucc"]

# corpus/ at the repo root stays the single source (the extractor writes its lock file next to it);
# the job reads the manifest from the wheel. uv_build cannot include a file from outside the package.
[tool.hatch.build.targets.wheel.force-include]
"corpus/manifest.yaml" = "eucc/corpus/manifest.yaml"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"  # oldest runtime: requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
