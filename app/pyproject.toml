# Environment of the Databricks App. The Apps runtime installs with uv only if pyproject.toml and
# uv.lock are both present and there is no requirements.txt; otherwise it uses pip on Python 3.11,
# which the eucc wheel (requires-python >= 3.12) refuses. uv apps take the Python version from
# requires-python. uv-requirements.txt alone does not switch to uv: it is the uv mode's file for
# wheel paths, here the eucc wheel on the artifacts volume.
#
# The dependencies are the eucc wheel's (../pyproject.toml) plus streamlit, pinned to the
# versions of ../uv.lock (tests/test_app.py); uv.lock resolves them from PyPI. The wheel itself is
# not listed: uv.lock would pin its sha256, which changes with every upload.
[project]
name = "eucc-copilot-app"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "databricks-sdk==0.161.0",
    "httpx==0.28.1",
    "langgraph==1.2.20",
    "lxml==6.1.3",
    "mlflow-skinny==3.18.0",
    "openai==3.46.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "sqlglot==30.30.0",
    "streamlit==1.67.0",
]

[tool.uv]
package = false  # app.py is a script, not a package to build.
