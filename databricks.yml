# Databricks Asset Bundle for eu-compliance-copilot.
# Workspace host is set here (all targets); no `profile` so service-principal env-var auth
# (CI) works. Locally, pass `-p free` on the command line.
#
# One Free Edition workspace hosts all targets; each target uses its own schema in the
# `workspace` catalog. The schemas are created by infra/terraform/, never by the bundle.
bundle:
  name: eu-compliance-copilot

workspace:
  host: https://dbc-405898bc-c90e.cloud.databricks.com

include:
  - resources/*.yml

# The eucc package as a wheel, built from the repo root on every deploy and installed in the job
# environments (resources/*.yml: ../dist/*.whl). The CLI uploads it and replaces the local path.
# --clear drops stale wheels, so the glob matches exactly one file; dynamic_version appends a
# timestamp to the version so serverless environments never reuse a cached older build.
artifacts:
  eucc:
    type: whl
    path: .
    build: uv build --wheel --clear
    dynamic_version: true
    files:
      - source: dist/*.whl

variables:
  catalog:
    description: Unity Catalog catalog for all tables.
    default: workspace
  schema:
    description: Schema for this target (set per target).

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: compliance_dev

  staging:
    mode: production
    # One shared workspace: prefix names so staging/prod resources don't collide (409 "already
    # used"). In a multi-workspace setup (one workspace per target) the prefix would not be needed.
    presets:
      name_prefix: "[staging] "
    workspace:
      # Private to the deploying identity (the CI/CD SP in CI), unlike /Workspace/Shared.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 0af2526a-d869-4722-8988-c45fffd0144b
    variables:
      schema: compliance_staging

  prod:
    mode: production
    # One shared workspace: prefix names so staging/prod resources don't collide (409 "already
    # used"). In a multi-workspace setup (one workspace per target) the prefix would not be needed.
    presets:
      name_prefix: "[prod] "
    workspace:
      # Private to the deploying identity (the CI/CD SP in CI), unlike /Workspace/Shared.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 0af2526a-d869-4722-8988-c45fffd0144b
    variables:
      schema: compliance_prod
